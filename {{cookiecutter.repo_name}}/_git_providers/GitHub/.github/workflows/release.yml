name: Release

on:
  workflow_run:
    workflows: ["qa"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ "{{" }} steps.version.outputs.version }}
      tag: ${{ "{{" }} steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ "{{" }} secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Bump version to final
        run: uvx ebump final

      - name: Get version after bump
        id: bumped_version
        run: |
          VERSION=$(uvx ebump)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "Bump version to ${{ "{{" }} steps.bumped_version.outputs.version }}"
          git push origin main

      - name: Get version
        id: version
        run: |
          VERSION=$(uvx ebump)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ "{{" }} steps.version.outputs.tag }}
          generate_release_notes: false

  build:
    name: Build and publish distribution
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/{{ cookiecutter.package_name }}/
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Attach build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ "{{" }} needs.release.outputs.tag }}
          files: |
            dist/*
          fail_on_unmatched_files: true

      - name: Publish to PyPI
        run: |
          if uv publish; then
            echo "PyPI upload completed successfully."
          else
            echo "::warning::PyPI upload failed; the GitHub release remains available."
          fi

  prepare-next:
    needs: [release, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ "{{" }} secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Bump version to next patch beta
        run: uvx ebump patch beta

      - name: Get version after next bump
        id: next_version
        run: |
          VERSION=$(uvx ebump)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit next version preparation
        run: |
          git add -A
          git commit -m "Prepare next version (${{ "{{" }} steps.next_version.outputs.version }})"
          git push origin main
