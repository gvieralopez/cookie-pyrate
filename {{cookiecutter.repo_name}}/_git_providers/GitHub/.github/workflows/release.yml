name: Release

on:
  workflow_run:
    workflows: ["QA"]
    branches: [main]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: gvieralopez/cookie-pyrate/.github/workflows/reusable-release.yml@{{ cookiecutter.__cookiepyrate_version }}
    permissions:
      contents: write
    with:
      cookie-pyrate-ref: {{ cookiecutter.__cookiepyrate_version }}
      create-github-release: true
      attach-distribution: false
{% if cookiecutter.with_dockerfile %}      publish-docker-image: false # if set to true, needs extra config — see DEVELOPMENT.md
{% endif %}      prepare-next-version: true
    # Passes RELEASE_SSH_KEY (created by `make repo`; lets the version bumps land on a
    # protected main) and any secret named in secret-env.
    secrets: inherit
