name: Release

on:
  workflow_run:
    workflows: ["qa"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build and release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/{{ cookiecutter.package_name }}/

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ "{{" }} github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ "{{" }} secrets.GITHUB_TOKEN }}

      - name: Finalize version
        id: version
        uses: gvieralopez/cookie-pyrate/github-actions/finalize-version@{{ cookiecutter.__cookiepyrate_version }}
        with:
          ebump-arguments: final

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ "{{" }} steps.version.outputs.tag }}
          generate_release_notes: false
          files: |
            dist/*
          fail_on_unmatched_files: true

      - name: Publish to PyPI
        run: |
          if uv publish; then
            echo "PyPI upload completed successfully."
          else
            echo "::warning::PyPI upload failed; the GitHub release remains available."
          fi

      - name: Prepare next version
        uses: gvieralopez/cookie-pyrate/github-actions/prepare-next-version@{{ cookiecutter.__cookiepyrate_version }}
        with:
          ebump-arguments: patch beta