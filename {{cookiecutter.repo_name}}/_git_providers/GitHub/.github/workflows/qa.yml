name: QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    uses: gvieralopez/cookie-pyrate/.github/workflows/reusable-qa.yml@{{ cookiecutter.__cookiepyrate_version }}
    with:
      cookie-pyrate-ref: {{ cookiecutter.__cookiepyrate_version }}
      python-version: "{{ cookiecutter.python_version }}"
