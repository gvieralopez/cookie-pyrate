site_name: {{cookiecutter.project_name}}
site_description: {{cookiecutter.project_description}}
site_dir: dist/docs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_if_no_docstring: true
            show_submodules: true
            merge_init_into_class: true
            filters: ["!^_", "!^logger$"]

theme:
  name: 'material'
  language: 'en'
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: 'default'
      primary: 'white'
      accent: 'blue'
      toggle:
        icon: 'material/brightness-7'
        name: 'Switch to dark mode'
    - media: '(prefers-color-scheme: dark)'
      scheme: 'slate'
      primary: 'black'
      accent: 'blue'
      toggle:
        icon: 'material/brightness-4'
        name: 'Switch to light mode'
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  logo: 'images/logo.svg'
  favicon: 'images/logo.svg'
  features:
    - navigation.sections # Separates sections within the navigation
    - navigation.top # Moves the navigation to the top bar

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
      linenums: true
  - pymdownx.superfences  # Enhances fenced code blocks
  - toc:
      permalink: true

nav:
  - 🏠 Home: index.md
  - 📖 Reference: reference.md
  - ℹ️ About: about.md
