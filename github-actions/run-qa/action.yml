name: Run QA
description: Run the standard Cookie Pyrate quality checks

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash
      run: uv sync --locked
    - name: Check lint
      shell: bash
      run: uv run ruff check
    - name: Check formatting
      shell: bash
      run: uv run ruff format --check
    - name: Type-check
      shell: bash
      run: uv run mypy
    - name: Run tests
      shell: bash
      run: uv run pytest
