name: Run QA
description: Run the standard Cookie Pyrate quality checks

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.15"
  system-dependencies:
    description: Space separated apt packages to install first (Debian/Ubuntu runners only)
    required: false
    default: ""
  uv-version:
    description: uv version to install
    required: false
    default: "0.13.5"
  checks:
    description: Run lint, format and type checks too ("false" runs only the tests)
    required: false
    default: "true"
  setup-command:
    description: Bash run before the dependencies are installed
    required: false
    default: ""
  setup-env:
    description: NAME=value lines exported to the setup command alone (the caller's SETUP_ENV secret)
    required: false
    default: ""
  extra-checks:
    description: Bash run after the tests, with the checks; a failure fails QA
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.system-dependencies != ''
      shell: bash
      env:
        SYSTEM_DEPENDENCIES: ${{ inputs.system-dependencies }}
        DEBIAN_FRONTEND: noninteractive
      run: |
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then
          SUDO=sudo
        fi
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends $SYSTEM_DEPENDENCIES

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        python-version: ${{ inputs.python-version }}
    - name: Run the setup command
      if: inputs.setup-command != ''
      # Expects the Cookie Pyrate checkout at .cookie-pyrate, like this action itself.
      uses: ./.cookie-pyrate/.github/actions/run-setup
      with:
        command: ${{ inputs.setup-command }}
        setup-env: ${{ inputs.setup-env }}
    - name: Install dependencies
      shell: bash
      run: uv sync --locked
    - name: Check lint
      if: inputs.checks == 'true'
      shell: bash
      run: uv run --no-sync ruff check
    - name: Check formatting
      if: inputs.checks == 'true'
      shell: bash
      run: uv run --no-sync ruff format --check
    - name: Type-check
      if: inputs.checks == 'true'
      shell: bash
      run: uv run --no-sync mypy
    - name: Run tests
      shell: bash
      run: uv run --no-sync pytest
    - name: Run the extra checks
      if: inputs.checks == 'true' && inputs.extra-checks != ''
      shell: bash
      env:
        COMMAND: ${{ inputs.extra-checks }}
      run: bash -eo pipefail -c "$COMMAND"
