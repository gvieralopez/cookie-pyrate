name: Publish to PyPI
description: >
  Build the released commit and publish it to PyPI with Trusted Publishing. Call it from a job in
  the project's own release workflow, after the reusable release: PyPI only trusts the workflow
  file that defines the uploading job, and a composite action runs inside the job that calls it.

inputs:
  sha:
    description: Commit to build, the reusable release's `sha` output
    required: true
  index:
    description: Where to publish, `pypi` or `testpypi`
    required: false
    default: pypi
  system-dependencies:
    description: Space separated apt packages to install before building (Debian/Ubuntu runners only)
    required: false
    default: ""
  setup-command:
    description: Bash run before building; set the secrets it needs in the calling step's `env`
    required: false
    default: ""
  uv-version:
    description: uv version to install
    required: false
    default: "0.13.5"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.sha }}

    - name: Install system dependencies
      if: inputs.system-dependencies != ''
      shell: bash
      env:
        SYSTEM_DEPENDENCIES: ${{ inputs.system-dependencies }}
        DEBIAN_FRONTEND: noninteractive
      run: |
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then
          SUDO=sudo
        fi
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends $SYSTEM_DEPENDENCIES

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ inputs.uv-version }}

    - name: Run the setup command
      if: inputs.setup-command != ''
      shell: bash
      env:
        COMMAND: ${{ inputs.setup-command }}
      run: bash -eo pipefail -c "$COMMAND"

    - name: Build distribution
      shell: bash
      run: uv build

    - name: Publish
      shell: bash
      env:
        INDEX: ${{ inputs.index }}
      run: |
        case "$INDEX" in
          pypi) upload=https://upload.pypi.org/legacy/ simple=https://pypi.org/simple/ ;;
          testpypi) upload=https://test.pypi.org/legacy/ simple=https://test.pypi.org/simple/ ;;
          *) echo "::error::index must be pypi or testpypi, not '$INDEX'"; exit 1 ;;
        esac
        # --check-url skips files the index already has, so a re-run after a partial upload finishes it.
        uv publish --trusted-publishing always --publish-url "$upload" --check-url "$simple"
