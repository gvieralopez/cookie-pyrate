name: Export secrets
description: Export the named secrets as environment variables for the rest of the job

inputs:
  names:
    description: Space separated names of the secrets to export
    required: true
  secrets:
    description: The calling job's secrets, as `toJSON(secrets)`
    required: true

runs:
  using: composite
  steps:
    - name: Export the requested secrets
      shell: bash
      env:
        NAMES: ${{ inputs.names }}
        SECRETS: ${{ inputs.secrets }}
      run: |
        for name in $NAMES; do
          value=$(jq -r --arg name "$name" '.[$name] // empty' <<<"$SECRETS")
          if [ -z "$value" ]; then
            echo "::error::Secret $name isn't available. Add it to the repository and call the workflow with 'secrets: inherit'."
            exit 1
          fi
          echo "::add-mask::$value"
          delimiter="SECRET_${RANDOM}${RANDOM}"
          { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
        done
