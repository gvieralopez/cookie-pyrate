name: Reusable QA

on:
  workflow_call:
    inputs:
      cookie-pyrate-ref:
        description: Cookie Pyrate ref the shared actions are taken from
        required: true
        type: string
      runner:
        description: Runner image the checks run on
        required: false
        type: string
        default: ubuntu-latest
      system-dependencies:
        description: Space separated apt packages to install first (Debian/Ubuntu runners only)
        required: false
        type: string
        default: ""
      python-version:
        description: Python version to use
        required: false
        type: string
        default: "3.14"
      uv-version:
        description: uv version to install
        required: false
        type: string
        default: "0.13.5"
      test-python-versions:
        description: >
          JSON list of extra Python versions to run the tests on, e.g. '["3.12", "3.13"]'.
          Lint, format and type checks run once, on python-version.
        required: false
        type: string
        default: "[]"
      setup-command:
        description: Bash run before the dependencies are installed (e.g. to fetch private wheels)
        required: false
        type: string
        default: ""
      extra-checks:
        description: Bash run after the tests, in the synced environment; a failure fails QA
        required: false
        type: string
        default: ""
      secret-env:
        description: >
          Space separated names of the caller's secrets to export as environment variables.
          The calling job needs `secrets: inherit`.
        required: false
        type: string
        default: ""

jobs:
  # The required status check is "<caller job> / Run QA": this gate keeps that name stable
  # whatever runs behind it, so it has to stay the first job.
  qa:
    name: Run QA
    needs: [checks, tests]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Require every QA job to pass
        if: needs.checks.result != 'success' || contains(fromJSON('["failure", "cancelled"]'), needs.tests.result)
        run: exit 1

  checks:
    name: Lint, types and tests (Python ${{ inputs.python-version }})
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the Cookie Pyrate actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gvieralopez/cookie-pyrate
          ref: ${{ inputs.cookie-pyrate-ref }}
          path: .cookie-pyrate

      - name: Export the requested secrets
        if: inputs.secret-env != ''
        uses: ./.cookie-pyrate/.github/actions/export-secrets
        with:
          names: ${{ inputs.secret-env }}
          secrets: ${{ toJSON(secrets) }}

      - uses: ./.cookie-pyrate/.github/actions/run-qa
        with:
          python-version: ${{ inputs.python-version }}
          system-dependencies: ${{ inputs.system-dependencies }}
          uv-version: ${{ inputs.uv-version }}
          setup-command: ${{ inputs.setup-command }}
          extra-checks: ${{ inputs.extra-checks }}

  tests:
    # GitHub appends the matrix value ("Tests (3.12)"); a skipped matrix then reads just "Tests".
    name: Tests
    if: toJSON(fromJSON(inputs.test-python-versions)) != '[]'
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.test-python-versions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the Cookie Pyrate actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gvieralopez/cookie-pyrate
          ref: ${{ inputs.cookie-pyrate-ref }}
          path: .cookie-pyrate

      - name: Export the requested secrets
        if: inputs.secret-env != ''
        uses: ./.cookie-pyrate/.github/actions/export-secrets
        with:
          names: ${{ inputs.secret-env }}
          secrets: ${{ toJSON(secrets) }}

      - uses: ./.cookie-pyrate/.github/actions/run-qa
        with:
          python-version: ${{ matrix.python-version }}
          system-dependencies: ${{ inputs.system-dependencies }}
          uv-version: ${{ inputs.uv-version }}
          checks: "false"
          setup-command: ${{ inputs.setup-command }}
