name: Release

on:
  workflow_run:
    workflows: ["QA"]
    branches: [main]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      contents: write
    with:
      cookie-pyrate-ref: ${{ github.sha }}
