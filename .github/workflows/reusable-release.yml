name: Reusable Release

on:
  workflow_call:
    inputs:
      branch:
        description: Branch to release from
        required: false
        type: string
        default: main
      cookie-pyrate-ref:
        description: Cookie Pyrate ref the shared actions are taken from
        required: true
        type: string
      runner:
        description: Runner image the release jobs run on
        required: false
        type: string
        default: ubuntu-latest
      system-dependencies:
        description: Space separated apt packages to install before building (Debian/Ubuntu runners only)
        required: false
        type: string
        default: ""
      create-github-release:
        description: Create a GitHub release for the finalized version
        required: false
        type: boolean
        default: true
      attach-distribution:
        description: Build the distribution and attach it to the GitHub release
        required: false
        type: boolean
        default: false
      publish-to-pypi:
        description: >
          Publish the distribution to PyPI. The calling job must grant
          `id-token: write` for Trusted Publishing; a caller that leaves this
          off only needs `contents: write`.
        required: false
        type: boolean
        default: false
      pypi-project-url:
        description: Project URL shown on the pypi deployment environment
        required: false
        type: string
        default: ""
      publish-docker-image:
        description: >
          Build the Dockerfile and push it to GHCR as ghcr.io/<owner>/<repo>, tagged with
          the version and `latest`. The calling job must grant `packages: write`.
        required: false
        type: boolean
        default: false
      docker-platforms:
        description: Comma separated platforms to build the Docker image for
        required: false
        type: string
        default: linux/amd64
      prepare-next-version:
        description: Bump to the next development version once the release is out
        required: false
        type: boolean
        default: true
      next-version-bump:
        description: Version part to bump for the next development version (patch, minor or major)
        required: false
        type: string
        default: patch
      next-version-prerelease:
        description: Prerelease tag for the next development version (alpha, beta, rc, dev or post)
        required: false
        type: string
        default: beta
      ebump-version:
        description: ebump version to install
        required: false
        type: string
        default: "0.2.1"
      uv-version:
        description: uv version to install
        required: false
        type: string
        default: "0.12.6"
    secrets:
      release-ssh-key:
        description: >
          Private half of a deploy key allowed to bypass the branch rules, used to
          push the version bumps. Leave it unset to push with `GITHUB_TOKEN`, which
          only works while the branch is unprotected.
        required: false

jobs:
  release:
    name: Finalize version and create release
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    outputs:
      version: ${{ steps.finalize.outputs.version }}
      tag: ${{ steps.finalize.outputs.tag }}
      sha: ${{ steps.finalize.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.release-ssh-key }}

      - name: Check out the Cookie Pyrate actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gvieralopez/cookie-pyrate
          ref: ${{ inputs.cookie-pyrate-ref }}
          path: .cookie-pyrate

      - name: Finalize version
        id: finalize
        uses: ./.cookie-pyrate/.github/actions/bump-version
        with:
          branch: ${{ inputs.branch }}
          ebump-version: ${{ inputs.ebump-version }}
          uv-version: ${{ inputs.uv-version }}

      - name: Create GitHub release
        if: inputs.create-github-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.finalize.outputs.tag }}
          target_commitish: ${{ steps.finalize.outputs.sha }}
          generate_release_notes: false
          draft: ${{ inputs.attach-distribution || inputs.publish-to-pypi }}

  build-and-publish:
    name: Build, attach and publish the distribution
    needs: release
    if: inputs.attach-distribution || inputs.publish-to-pypi
    runs-on: ${{ inputs.runner }}
    # Permissions are inherited from the calling job on purpose: declaring them
    # here would drop `id-token: write` and break PyPI Trusted Publishing.
    # Only gate the job behind the "pypi" environment (and any protection
    # rules attached to it) when a PyPI publish can actually happen. When
    # only attach-distribution is requested, this resolves to a distinct,
    # unprotected environment name so attach-only runs are never blocked
    # on PyPI approvals.
    environment:
      name: ${{ inputs.publish-to-pypi && 'pypi' || 'release-artifact' }}
      url: ${{ inputs.publish-to-pypi && inputs.pypi-project-url || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install system dependencies
        if: inputs.system-dependencies != ''
        env:
          SYSTEM_DEPENDENCIES: ${{ inputs.system-dependencies }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO=sudo
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends $SYSTEM_DEPENDENCIES

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build distribution
        run: uv build

      - name: Attach the distribution to the GitHub release
        if: inputs.attach-distribution && inputs.create-github-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true

      - name: Publish to PyPI
        if: inputs.publish-to-pypi
        run: uv publish

      - name: Publish the GitHub release
        if: inputs.create-github-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          target_commitish: ${{ needs.release.outputs.sha }}
          draft: false

  publish-docker-image:
    name: Build and push the Docker image
    needs: [release, build-and-publish]
    # Runs only once the distribution is out: a failed PyPI publish deletes the draft
    # release, and an image must not outlive the release it was built for.
    if: >
      always() && inputs.publish-docker-image &&
      needs.release.result == 'success' &&
      needs.build-and-publish.result != 'failure'
    runs-on: ${{ inputs.runner }}
    # Permissions are inherited from the calling job on purpose: declaring
    # `packages: write` here would make the workflow fail to start for every caller
    # that does not grant it, including the ones that never publish an image.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up QEMU for foreign platforms
        if: inputs.docker-platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Name and label the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # The image is built from the version bump commit, not from the commit that
          # triggered the release, which is what the revision label would default to.
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ inputs.docker-platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-failed-release:
    name: Delete the draft release after a failed build
    needs: [release, build-and-publish]
    if: always() && inputs.create-github-release && needs.build-and-publish.result == 'failure'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          if gh release delete "$TAG" --repo "${{ github.repository }}" --yes; then
            echo "Deleted draft release $TAG after a failed build."
          else
            echo "::warning::Could not delete draft release $TAG (it may not exist, or may already be published)."
          fi

  prepare-next:
    name: Prepare the next development version
    needs: [release, build-and-publish]
    if: >
      always() && inputs.prepare-next-version &&
      needs.release.result == 'success' &&
      needs.build-and-publish.result != 'failure'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.release-ssh-key }}

      - name: Check out the Cookie Pyrate actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gvieralopez/cookie-pyrate
          ref: ${{ inputs.cookie-pyrate-ref }}
          path: .cookie-pyrate

      - name: Bump to the next development version
        uses: ./.cookie-pyrate/.github/actions/bump-version
        with:
          branch: ${{ inputs.branch }}
          bump: ${{ inputs.next-version-bump }}
          prerelease: ${{ inputs.next-version-prerelease }}
          ebump-version: ${{ inputs.ebump-version }}
          uv-version: ${{ inputs.uv-version }}
