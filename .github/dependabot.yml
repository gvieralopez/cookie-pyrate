version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/run-qa
      - /.github/actions/bump-version
      - /.github/actions/export-secrets
      - /.github/actions/publish-to-pypi
    schedule:
      interval: monthly

  # The template's pyproject.toml holds Jinja tags, which Dependabot can't parse.
  # No version-update PRs (limit 0): this block only exists to exclude it.
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - "{{cookiecutter.repo_name}}/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
